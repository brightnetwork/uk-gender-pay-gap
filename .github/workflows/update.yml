
name: Scrape latest data

permissions: {}

on:
  push:
  schedule:
    - cron:  '0 2 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3.7.0 # zizmor: ignore[artipacked] job pushes scraped data with checkout creds
      - name: Fetch latest data
        run: |
          year=$(date --date="-3 months -5 days" +"%Y")
          curl "https://gender-pay-gap.service.gov.uk/viewing/download-data/${year}" > "${year}-$((year+1)).csv"
      - name: Commit and push if it changed
        run: |
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          timestamp=$(date -u)
          git commit -m "Latest data: ${timestamp}" || exit 0
          git push
